<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belgian Beer Navigator</title>
    
    <!-- iPhone Safari向け PWA（ネイティブアプリ風フルスクリーン起動）設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Beer Nav">
    
    <!-- タブアイコン -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='25' y='25' width='50' height='60' rx='5' fill='%23f39c12'/><rect x='20' y='15' width='60' height='15' rx='5' fill='%23ffffff'/><path d='M75,35 h10 a10,10 0 0,1 10,10 v15 a10,10 0 0,1 -10,10 h-10' fill='none' stroke='%23f39c12' stroke-width='8'/></svg>">
    
    <!-- ダークモード初期判定（画面チラつき防止） -->
    <script>
        const savedTheme = localStorage.getItem('belgianBeerTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <style>
        /* ライトモード変数（基本） */
        :root {
            --bg-main: #f5f2eb; --bg-card: #ffffff; --bg-modal: #ffffff;
            --text-main: #2c2c2c; --text-sub: #595959; --accent: #d35400;
            --link-color: #2980b9; --btn-l1-bg: #4a6572; --btn-l1-text: #ffffff;
            --btn-l2-bg: #e2dcd0; --btn-l2-text: #2c2c2c; --btn-hover: #f39c12;
            --border-color: #e0e0e0; --shadow: 0 2px 6px rgba(0,0,0,0.06);
            --star-off: #cccccc; --star-on: #f39c12; --count-bg: rgba(211, 84, 0, 0.1);
            --memo-bg: #fffbf5;
        }
        /* ダークモード変数 */
        html.dark-theme {
            --bg-main: #1a1a1a; --bg-card: #2c2c2c; --bg-modal: #2a2a2a;
            --text-main: #e0e0e0; --text-sub: #aaaaaa; --accent: #e67e22;
            --link-color: #5dade2; --btn-l1-bg: #34495e; --btn-l1-text: #ffffff;
            --btn-l2-bg: #424242; --btn-l2-text: #e0e0e0; --btn-hover: #d35400;
            --border-color: #444444; --shadow: 0 2px 6px rgba(0,0,0,0.3);
            --star-off: #555555; --star-on: #f39c12; --count-bg: rgba(230, 126, 34, 0.15);
            --memo-bg: #332d27;
        }
        
        body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 0; padding: 10px; line-height: 1.5; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* ヘッダー・設定アイコン群 */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 22px; margin: 0; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: var(--text-main); transition: all 0.2s; box-shadow: var(--shadow); }
        .icon-btn:hover { background: var(--border-color); }
        
        .portal-links { font-size: 13px; background: var(--bg-card); padding: 8px 12px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .portal-links a { color: var(--link-color); text-decoration: none; font-weight: bold; }
        
        .controls-wrapper { background: var(--bg-card); padding: 12px; border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border-color); position: sticky; top: 5px; z-index: 90; }
        .search-sort-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .search-bar, .sort-select { padding: 8px 12px; font-size: 16px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-main); color: var(--text-main); }
        .search-bar { flex: 1; min-width: 200px; }
        
        .hit-count-top { font-size: 14px; font-weight: bold; color: var(--accent); background: var(--count-bg); padding: 6px 12px; border-radius: 6px; display: inline-block; margin-bottom: 10px; border: 1px dashed var(--accent); }
        
        .level1-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .btn { border: none; border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn-l1 { background-color: var(--btn-l1-bg); color: var(--btn-l1-text); }
        .btn-l1.active { background-color: var(--accent); font-weight: bold; }
        .btn-fav { background-color: var(--bg-main); color: var(--star-on); border: 1px solid var(--border-color); font-weight: bold; }
        .btn-fav.active { background-color: var(--star-on); color: #fff; border-color: var(--star-on); }
        .btn-reset { background-color: #c0392b; color: white; }
        .btn-random { background-color: #8e44ad; color: white; font-weight: bold; }
        .btn-random:hover { background-color: #9b59b6; }
        
        .level2-container { display: none; margin-top: 10px; padding: 10px; border-radius: 6px; background: var(--bg-main); border-left: 4px solid var(--accent); }
        .level2-container.active { display: block; }
        .level2-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .btn-l2 { background-color: var(--btn-l2-bg); color: var(--btn-l2-text); border: 1px solid var(--border-color); }
        .btn-l2.active { background-color: var(--btn-hover); color: #fff; border-color: var(--btn-hover); font-weight: bold; }
        
        .beer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .beer-card { background: var(--bg-card); border-radius: 8px; padding: 12px; border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; }
        .card-top { display: flex; gap: 12px; margin-bottom: 10px; }
        .beer-img { width: 80px; height: 120px; object-fit: contain; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; }
        .beer-info { flex: 1; min-width: 0; }
        .beer-title-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .beer-name { font-size: 16px; font-weight: bold; margin: 0 0 2px 0; }
        .beer-name a { color: var(--accent); text-decoration: none; }
        .star-btn { background: none; border: none; font-size: 24px; color: var(--star-off); cursor: pointer; padding: 0 5px; line-height: 1; }
        .star-btn.active { color: var(--star-on); }
        .beer-reading { font-size: 11px; color: var(--text-sub); display: block; margin-bottom: 4px; }
        .meta-line { font-size: 12px; color: var(--text-sub); margin-bottom: 2px; }
        
        .clickable-link { color: var(--link-color); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(41, 128, 185, 0.4); transition: color 0.2s; font-weight: bold; }
        .clickable-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
        .tag-link { color: #16a085; text-decoration-color: rgba(22, 160, 133, 0.4); }
        .tag-link:hover { color: var(--accent); }
        .map-link { display: inline-block; background: var(--link-color); color: #fff; padding: 2px 8px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: bold; margin-left: 4px; }
        .map-link:hover { background: var(--accent); }
        .tag-list { margin-top: 4px; font-size: 11px; }
        .beer-desc { font-size: 12px; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; background: var(--bg-main); padding: 8px; border-radius: 4px; }
        
        /* モーダル */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-modal); padding: 20px; border-radius: 10px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .modal-top-title { font-size: 14px; font-weight: bold; color: var(--text-sub); margin: 0; }
        .modal-close { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; color: var(--text-main); cursor: pointer; padding: 4px 12px; font-weight: bold; }
        .modal-header { display: flex; gap: 15px; margin-bottom: 15px; }
        .modal-img { width: 120px; height: 180px; object-fit: contain; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; cursor: zoom-in; }
        .modal-title { font-size: 20px; margin: 0 0 5px 0; display: inline-block; }
        .modal-title a { color: var(--accent); text-decoration: none; }
        .modal-body { font-size: 13.5px; line-height: 1.6; }
        .detail-section { margin-bottom: 12px; background: var(--bg-main); padding: 10px 12px; border-radius: 6px; border-left: 4px solid var(--accent); }
        .detail-section h4 { font-size: 13px; color: var(--accent); margin: 0 0 4px 0; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; }
        .detail-section p { margin: 0; color: var(--text-main); }

        /* メモ領域 */
        .memo-section { margin-top: 15px; background: var(--memo-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--accent); }
        .memo-section h4 { margin: 0 0 10px 0; color: var(--accent); font-size: 14px; }
        .memo-input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: 13.5px; color: var(--text-main); background: var(--bg-card); }
        .btn-save-memo { background-color: var(--accent); color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .memo-saved-msg { color: #27ae60; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .memo-saved-msg.show { opacity: 1; }
        
        .btn-evernote { background-color: #00a82d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }

        /* Lightbox */
        .lightbox-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .lightbox-overlay.active { display: flex; }
        .lightbox-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.5); width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
        
        /* 設定モーダル用 */
        .settings-btn-block { width: 100%; text-align: center; display: block; box-sizing: border-box; padding: 10px; margin-bottom: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); }
        .settings-btn-block:hover { background: var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Belgian Beer Navigator</h1>
        <div class="header-actions">
            <!-- ダークモード手動切替 -->
            <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="テーマ切替">🌙</button>
            <!-- データバックアップ・復元用の設定 -->
            <button class="icon-btn" onclick="openSettings()" title="設定・バックアップ">⚙️</button>
        </div>
    </div>
    
    <div class="portal-links">
        <span>🔗 ポータルサイト:</span>
        <a href="https://www.belgianbeer.co.jp/search.php" target="_blank">ベルギービールJapan</a>
        <a href="https://kinki-beer.jp/" target="_blank">KINKI BEER</a>
        <a href="https://www.worldbeer.co.jp/beer/belgium/index.html" target="_blank">廣島</a>
        <a href="https://konishi.be/beer.html?product-list_page=10" target="_blank">小西酒造</a>
    </div>

    <div class="controls-wrapper" id="controlsWrapper">
        <div class="search-sort-row">
            <input type="text" id="searchInput" class="search-bar" placeholder="名前、特徴、テイスティングメモで検索...">
            <select id="sortSelect" class="sort-select">
                <option value="name">五十音順</option>
                <option value="category">分類毎</option>
                <option value="brewery">醸造所毎</option>
                <option value="region">地域毎</option>
                <option value="abv_desc" selected>アルコール度数 (高い順)</option>
                <option value="abv_asc">アルコール度数 (低い順)</option>
            </select>
        </div>
        
        <div id="hitCountDisplay" class="hit-count-top">全 0 件中 0 件 を表示</div>
        
        <div class="level1-row">
            <button class="btn btn-reset" onclick="resetFilters()">リセット</button>
            <!-- 今日の1杯ランダム提案ボタン -->
            <button class="btn btn-random" onclick="showRandomBeer()" title="現在の絞り込みからランダムに1件表示">🎲 今日の1杯</button>
            <button class="btn btn-fav" id="favFilterBtn" onclick="toggleFavoritesFilter()">★ お気に入り</button>
            <button class="btn btn-l1" onclick="toggleLevel1('category')">ビール分類</button>
            <button class="btn btn-l1" onclick="toggleLevel1('brewery')">醸造所</button>
            <button class="btn btn-l1" onclick="toggleLevel1('tag')">用語</button>
            <button class="btn btn-l1" onclick="toggleLevel1('region')">地域</button>
            <button class="btn btn-l1" onclick="toggleLevel1('abv')">アルコール度数</button>
        </div>
        <div id="level2Container" class="level2-container"><div id="level2Buttons" class="level2-row"></div></div>
    </div>
    <div class="beer-grid" id="beerGrid"></div>
</div>

<!-- ビール詳細モーダル -->
<div class="modal-overlay" id="beerModal" onclick="closeModal('beerModal', event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-top-bar">
            <h3 class="modal-top-title">詳細情報</h3>
            <button class="modal-close" onclick="closeModal('beerModal', event)">✖ 閉じる</button>
        </div>
        <div id="modalContentInner"></div>
    </div>
</div>

<!-- 設定モーダル（バックアップ・インポート） -->
<div class="modal-overlay" id="settingsModal" onclick="closeModal('settingsModal', event)">
    <div class="modal-content" style="max-width: 400px;" onclick="event.stopPropagation()">
        <div class="modal-top-bar">
            <h3 class="modal-top-title">⚙️ 設定・データ管理</h3>
            <button class="modal-close" onclick="closeModal('settingsModal', event)">✖ 閉じる</button>
        </div>
        <div class="modal-body">
            <p style="font-size: 12px; color: var(--text-sub); margin-bottom:15px;">機種変更時などに「お気に入り」と「テイスティングメモ」をバックアップ・復元できます。</p>
            <button class="settings-btn-block" onclick="exportData()" style="color:var(--accent); border-color:var(--accent);">📤 データをバックアップ (保存)</button>
            <hr style="border-top:1px dashed var(--border-color); margin: 15px 0;">
            <label class="settings-btn-block">
                📥 データを復元 (読込)
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
            </label>
            <p style="font-size: 11px; color: var(--text-sub); margin-top:5px;">※ 復元すると現在のデータは上書きされます。</p>
        </div>
    </div>
</div>

<!-- 画像拡大Lightbox -->
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-close" onclick="closeLightbox(event)">&times;</div>
    <img src="" alt="拡大画像" id="lightboxImg" class="lightbox-img" onclick="event.stopPropagation()">
</div>

<script>
// === ダークモード手動切替 ===
function toggleTheme() {
    document.documentElement.classList.toggle('dark-theme');
    const isDark = document.documentElement.classList.contains('dark-theme');
    localStorage.setItem('belgianBeerTheme', isDark ? 'dark' : 'light');
    updateThemeIcon(isDark);
}
function updateThemeIcon(isDark) {
    document.getElementById('themeToggleBtn').innerText = isDark ? '☀️' : '🌙';
}
updateThemeIcon(document.documentElement.classList.contains('dark-theme'));

// === 全127銘柄データ ===
const rawData = [
  [1, "Abbaye des Rocs", "アベイ・デ・ロック", "https://www.arome.jp/products/detail/715", "12bQfXO7pEhF_YnaMueoTzn1Z8z7Uhper", "アビイ", 9.0, "アベイ・デ・ロック醸造所", "Brasserie de l'Abbaye des Rocs", "エノー州", ["#修道院", "#アビイ", "#ブラウン", "#ダーク"], "豊かなモルトの風味とスパイシーな香りが特徴。高品質な水と厳選されたモルトを使用。", "取扱各社", "麦芽、ホップ、酵母", "純粋な水を使用し複数種のモルトをブレンド。瓶内二次発酵。", "ドライフルーツやカラメルのアロマ。スパイシーさとモルトの甘み。", "1979年設立。修道院の名を冠するが村の遺跡に由来。"],
  [2, "Achel Bruin", "アヘル・ブリューン", "https://belgianbrasseriecourt.jp/drink/achel-brown/", "1h2RZskvv6-dXPtUFva4GGNd8afX0zaMZ", "トラピスト", 8.0, "アヘル醸造所", "Brouwerij Achelse Kluis", "リンブルフ州", ["#トラピスト", "#修道院", "#ブラウン", "#ダーク"], "ロースト麦芽の香ばしさとドライな後味。", "三井食品", "麦芽、ホップ、糖類", "伝統的な修道院製法、瓶内二次発酵。", "カラメルの甘みと洋梨のような香り。後味はドライ。", "2021年最後の修道士退去、2023年トラピスト資格喪失。"],
  [3, "Ara bier", "アラ･ビール", "https://www.drankgigant.nl/ara-bier.html", "19hmH3VD1iCmdJ410_GuoRigCyW1OUk-y", "ペールエール", 8.0, "ドゥ・ドール醸造所", "De Dolle Brouwers", "西フランデレン州", ["#ゴールデン"], "フルーティーでホッピーな味わい。クリス・ヘルテレールによる個性的ラベル。", "取扱各社", "麦芽、ホップ", "ドライホッピング等の手法を取り入れ醸造。", "柑橘類やマスカットのような爽やかなフルーティーさと苦味。", "ラベルにはアラ（オウム）が描かれている。"],
  [4, "Barbar", "バルバール", "https://belgianbeer.site/products/barbar", "1EFmQU7YMjoVKcDSXEclPilqiEnnIhEn5", "ブロンド", 8.0, "ルフェーブル醸造所", "Brasserie Lefebvre", "ワロン・ブラバント州", ["#ゴールデン"], "はちみつを使用した特徴的な製法。ほのかな甘みとスパイシーさ。", "取扱各社", "麦芽、ホップ、はちみつ", "麦汁煮沸時にはちみつを投入するレシピ。", "はちみつのまろやかな甘みと柑橘系の風味。", "古代ガリア人の「はちみつ酒」からインスピレーション。"],

const beers = rawData.map(x => ({
    id: x[0], name: x[1], reading: x[2], url: x[3], driveId: x[4], category: x[5], abv: x[6],
    brewery: x[7], breweryLocal: x[8], region: x[9], tags: x[10], desc: x[11],
    importer: x[12], ingredients: x[13], process: x[14], taste: x[15], history: x[16]
}));

let favorites = [];
let memos = {};
try {
    favorites = JSON.parse(localStorage.getItem('belgianBeerFavs')) || [];
    memos = JSON.parse(localStorage.getItem('belgianBeerMemos')) || {};
} catch(e) { console.warn("ローカルストレージにアクセスできません。"); }

let showFavoritesOnly = false;
let currentFilteredBeers = [...beers];

function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
function exportData() {
    const data = { favorites, memos };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "belgian_beer_backup.json"; a.click();
    URL.revokeObjectURL(url);
}
function importData(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if(data.favorites) favorites = data.favorites;
            if(data.memos) memos = data.memos;
            localStorage.setItem('belgianBeerFavs', JSON.stringify(favorites));
            localStorage.setItem('belgianBeerMemos', JSON.stringify(memos));
            alert("データを復元しました。");
            closeModal('settingsModal'); filterAndSort();
        } catch(err) { alert("ファイルの読み込みに失敗しました。"); }
    };
    reader.readAsText(file);
    event.target.value = "";
}

function showRandomBeer() {
    if(currentFilteredBeers.length === 0) return alert('表示できるビールがありません。');
    const rnd = currentFilteredBeers[Math.floor(Math.random() * currentFilteredBeers.length)];
    openModal(rnd.id);
}

function applySingleFilter(type, val, event) {
    if (event) event.stopPropagation();
    currentFilters = { category: null, tag: null, abv: null, region: null, brewery: null };
    document.getElementById("searchInput").value = "";
    showFavoritesOnly = false;
    document.getElementById('favFilterBtn').classList.remove('active');

    if (val !== "すべて") currentFilters[type] = val;

    currentL1 = null; 
    document.querySelectorAll('.btn-l1').forEach(btn => btn.classList.remove('active'));
    document.getElementById('level2Container').classList.remove('active');

    closeModal('beerModal'); filterAndSort();
    document.getElementById('controlsWrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleFavorite(id, e) {
    if (e) e.stopPropagation();
    const index = favorites.indexOf(id);
    if (index > -1) favorites.splice(index, 1);
    else favorites.push(id);
    
    try { localStorage.setItem('belgianBeerFavs', JSON.stringify(favorites)); } catch(e){}
    
    const modalStar = document.getElementById('modalStar');
    if (modalStar && parseInt(modalStar.dataset.id) === id) {
        modalStar.classList.toggle('active', favorites.includes(id));
    }
    filterAndSort();
}

function toggleFavoritesFilter() {
    const isFavActive = !showFavoritesOnly;
    currentFilters = { category: null, tag: null, abv: null, region: null, brewery: null };
    document.getElementById("searchInput").value = "";
    currentL1 = null;
    document.querySelectorAll('.btn-l1').forEach(b => b.classList.remove('active'));
    document.getElementById('level2Container').classList.remove('active');
    
    showFavoritesOnly = isFavActive;
    document.getElementById('favFilterBtn').classList.toggle('active', showFavoritesOnly);
    filterAndSort();
}

function saveMemo(id, event) {
    if (event) event.stopPropagation();
    const dateVal = document.getElementById('memoDate').value;
    const textVal = document.getElementById('memoText').value;
    memos[id] = { date: dateVal, text: textVal };
    
    try { localStorage.setItem('belgianBeerMemos', JSON.stringify(memos)); } catch(e){}
    
    const msg = document.getElementById('memoSavedMsg');
    msg.classList.add('show');
    setTimeout(() => { msg.classList.remove('show'); }, 2000);
    filterAndSort(); // メモ検索対象化の更新
}

function shareToEvernote(id, event) {
    if (event) event.stopPropagation();
    const b = beers.find(beer => beer.id === id);
    if (!b) return;
    const currentMemoText = document.getElementById('memoText').value;
    const memoDate = document.getElementById('memoDate').value;
    let memoStr = currentMemoText ? `\n\n【テイスティングメモ】 (${memoDate})\n${currentMemoText}` : '';
    const shareText = `【${b.name}】\n醸造所: ${b.brewery}\n分類: ${b.category} | ABV: ${b.abv.toFixed(1)}%\n\n■ 特徴・味わい\n${b.taste}\n\n■ 歴史・豆知識\n${b.history}${memoStr}\n\nURL: ${b.url}`;

    if (navigator.share) {
        navigator.share({ title: b.name, text: shareText }).catch(err => { console.log('共有キャンセル:', err); });
    } else {
        navigator.clipboard.writeText(shareText).then(() => {
            alert("テキストをクリップボードにコピーしました。\nEvernoteやメモ帳などのアプリに貼り付けて保存してください。");
        }).catch(err => { alert("コピーに失敗しました。"); });
    }
}

function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

function openLightbox(src, event) {
    if (event) event.stopPropagation();
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(e) {
    if (e) e.stopPropagation();
    document.getElementById("lightbox").classList.remove("active");
}

const filterData = {
    category: ["すべて", "ランビック", "トラピスト", "アビイ", "トリプル", "ダブル", "セゾン", "サワー", "ホワイト", "アンバー", "ブラウン", "ピルスナー", "IPA", "フルーツ"],
    tag: ["#ランビック", "#トラピスト", "#アビイ", "#ブレタノマイセス", "#修道院", "#レッド", "#ゴールデン", "#ダーク", "#ダブル", "#ハイアルコール"],
    abv: ["4.9%以下", "5.0%〜6.9%", "7.0%〜8.9%", "9.0%以上"],
    region: ["西フランデレン州", "東フランデレン州", "フラームス・ブラバント州", "アントウェルペン州", "リンブルフ州", "ワロン・ブラバント州", "ナミュール州", "エノー州", "リエージュ州", "リュクサンブール州", "海外"],
    brewery: [...new Set(beers.map(b => b.brewery))].sort((a, b) => a.localeCompare(b, 'ja'))
};

let currentL1 = null; 
let currentFilters = { category: null, tag: null, abv: null, region: null, brewery: null };

const getImageUrl = (driveId) => `https://drive.google.com/thumbnail?id=${driveId}&sz=w600`;
const getMapUrl = (localName) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(localName)}`;

const grid = document.getElementById("beerGrid");
const level2Container = document.getElementById("level2Container");
const level2Buttons = document.getElementById("level2Buttons");
const hitCountDisplay = document.getElementById("hitCountDisplay");

function createCard(b) {
    const tags = b.tags ? b.tags.map(t => `<span class="clickable-link tag-link" onclick="applySingleFilter('tag', '${t}', event)">${t}</span>`).join(" ") : "";
    const isFav = favorites.includes(b.id);
    const starClass = isFav ? 'star-btn active' : 'star-btn';

    return `
        <div class="beer-card" onclick="openModal(${b.id})">
            <div class="card-top">
                <img src="${getImageUrl(b.driveId)}" alt="${b.name}" class="beer-img" loading="lazy">
                <div class="beer-info">
                    <div class="beer-title-row">
                        <h3 class="beer-name"><a href="${b.url}" target="_blank" onclick="event.stopPropagation()">${b.name}</a></h3>
                        <button class="${starClass}" onclick="toggleFavorite(${b.id}, event)" title="お気に入り登録">★</button>
                    </div>
                    <span class="beer-reading">${b.reading}</span>
                    <div class="meta-line">醸造所: <span class="clickable-link" onclick="applySingleFilter('brewery', '${b.brewery}', event)">${b.brewery}</span> <a href="${getMapUrl(b.breweryLocal)}" target="_blank" class="map-link" onclick="event.stopPropagation()">Map</a></div>
                    <div class="meta-line">分類: <span class="clickable-link" onclick="applySingleFilter('category', '${b.category}', event)">${b.category}</span> | 地域: <span class="clickable-link" onclick="applySingleFilter('region', '${b.region}', event)">${b.region}</span></div>
                    <div class="meta-line">ABV: <strong>${b.abv.toFixed(1)}%</strong></div>
                    <div class="tag-list">${tags}</div>
                </div>
            </div>
            <div class="beer-desc">${b.desc}</div>
        </div>
    `;
}

function render(data) {
    grid.innerHTML = data.length ? data.map(createCard).join("") : "<p style='grid-column: 1/-1;'>該当するビールが見つかりませんでした。</p>";
    
    let activeFilterText = [];
    if (showFavoritesOnly) activeFilterText.push("★お気に入り");
    if (currentFilters.category) activeFilterText.push(currentFilters.category);
    if (currentFilters.brewery) activeFilterText.push(currentFilters.brewery);
    if (currentFilters.tag) activeFilterText.push(currentFilters.tag);
    if (currentFilters.region) activeFilterText.push(currentFilters.region);
    if (currentFilters.abv) activeFilterText.push(currentFilters.abv);
    
    let filterStr = activeFilterText.length > 0 ? ` (絞り込み: ${activeFilterText.join(", ")})` : "";
    hitCountDisplay.innerText = `全 ${beers.length} 件中 ${data.length} 件 を表示${filterStr}`;
}

function toggleLevel1(type) {
    document.querySelectorAll('.btn-l1').forEach(b => b.classList.remove('active'));
    if (currentL1 === type) {
        currentL1 = null; level2Container.classList.remove('active');
    } else {
        currentL1 = type; event.target.classList.add('active');
        renderLevel2(type); level2Container.classList.add('active');
    }
}

function renderLevel2(type) {
    let html = '';
    filterData[type].forEach(val => {
        const isActive = currentFilters[type] === val ? 'active' : '';
        html += `<button class="btn btn-l2 ${isActive}" onclick="applySingleFilter('${type}', '${val}', event)">${val}</button>`;
    });
    level2Buttons.innerHTML = html;
}

function resetFilters() {
    currentFilters = { category: null, tag: null, abv: null, region: null, brewery: null };
    document.getElementById("searchInput").value = "";
    document.getElementById("sortSelect").value = "abv_desc";
    showFavoritesOnly = false;
    document.getElementById('favFilterBtn').classList.remove('active');
    currentL1 = null;
    document.querySelectorAll('.btn-l1').forEach(b => b.classList.remove('active'));
    level2Container.classList.remove('active');
    filterAndSort();
}

function filterAndSort() {
    const text = document.getElementById("searchInput").value.toLowerCase();
    
    let result = beers.filter(b => {
        if (showFavoritesOnly && !favorites.includes(b.id)) return false;
        
        const memoText = (memos[b.id] && memos[b.id].text) ? String(memos[b.id].text).toLowerCase() : "";
        const matchText = b.name.toLowerCase().includes(text) || b.reading.includes(text) || b.brewery.includes(text) || 
                          b.desc.includes(text) || (b.importer && String(b.importer).toLowerCase().includes(text)) || 
                          (b.taste && String(b.taste).toLowerCase().includes(text)) || (b.history && String(b.history).toLowerCase().includes(text)) ||
                          memoText.includes(text);
        if (!matchText) return false;
        
        if (currentFilters.category && b.category !== currentFilters.category) return false;
        if (currentFilters.tag && (!b.tags || !b.tags.includes(currentFilters.tag))) return false;
        if (currentFilters.region && b.region !== currentFilters.region) return false;
        if (currentFilters.brewery && b.brewery !== currentFilters.brewery) return false;
        
        if (currentFilters.abv) {
            const v = currentFilters.abv;
            if (v === "4.9%以下" && b.abv > 4.9) return false;
            if (v === "5.0%〜6.9%" && (b.abv < 5.0 || b.abv > 6.9)) return false;
            if (v === "7.0%〜8.9%" && (b.abv < 7.0 || b.abv > 8.9)) return false;
            if (v === "9.0%以上" && b.abv < 9.0) return false;
        }
        return true;
    });

    const sortType = document.getElementById("sortSelect").value;
    result.sort((a, b) => {
        if (sortType === 'name') return a.reading.localeCompare(b.reading, 'ja');
        if (sortType === 'category') return a.category.localeCompare(b.category, 'ja');
        if (sortType === 'brewery') return a.brewery.localeCompare(b.brewery, 'ja');
        if (sortType === 'region') return a.region.localeCompare(b.region, 'ja');
        if (sortType === 'abv_asc') return a.abv - b.abv;
        if (sortType === 'abv_desc') return b.abv - a.abv;
        return 0;
    });

    currentFilteredBeers = result;
    render(result);
}

const modal = document.getElementById("beerModal");
const modalInner = document.getElementById("modalContentInner");

function openModal(id) {
    const b = beers.find(beer => beer.id === id);
    if (!b) return;
    const tags = b.tags ? b.tags.map(t => `<span class="clickable-link tag-link" onclick="applySingleFilter('tag', '${t}', event)">${t}</span>`).join(" ") : "";
    const isFav = favorites.includes(b.id);
    const starClass = isFav ? 'star-btn active' : 'star-btn';
    const memo = memos[b.id] || { date: '', text: '' };

    modalInner.innerHTML = `
        <div class="modal-header">
            <img src="${getImageUrl(b.driveId)}" alt="${b.name}" class="modal-img" onclick="openLightbox('${getImageUrl(b.driveId)}', event)" title="タップして拡大">
            <div style="flex:1;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 5px;">
                    <h2 class="modal-title" style="margin:0;"><a href="${b.url}" target="_blank">${b.name}</a></h2>
                    <button id="modalStar" class="${starClass}" data-id="${b.id}" onclick="toggleFavorite(${b.id}, event)" style="font-size:30px; padding:0; margin-top:-5px;">★</button>
                </div>
                <div style="font-size: 13px; color: var(--text-sub); margin-bottom: 10px;">${b.reading}</div>
                <div class="meta-line">醸造所: <span class="clickable-link" onclick="applySingleFilter('brewery', '${b.brewery}', event)">${b.brewery}</span> <a href="${getMapUrl(b.breweryLocal)}" target="_blank" class="map-link">Map</a></div>
                <div class="meta-line">分類: <span class="clickable-link" onclick="applySingleFilter('category', '${b.category}', event)">${b.category}</span></div>
                <div class="meta-line">地域: <span class="clickable-link" onclick="applySingleFilter('region', '${b.region}', event)">${b.region}</span></div>
                <div class="meta-line">アルコール度数: <strong>${b.abv.toFixed(1)}%</strong></div>
                <div class="tag-list" style="font-size: 13px; margin-top: 8px;">${tags}</div>
            </div>
        </div>
        <div class="modal-body">
            <div class="detail-section"><h4>🚢 輸入元 (Importer)</h4><p>${b.importer}</p></div>
            <div class="detail-section"><h4>🌾 原材料 (Ingredients)</h4><p>${b.ingredients}</p></div>
            <div class="detail-section"><h4>⚗️ 製法・醸造の特徴</h4><p>${b.process}</p></div>
            <div class="detail-section"><h4>🍺 特徴・アロマ・味わい</h4><p>${b.taste}</p></div>
            <div class="detail-section"><h4>📖 歴史・醸造所エピソード・豆知識</h4><p>${b.history}</p></div>
            
            <div class="memo-section">
                <h4>📝 テイスティングメモ</h4>
                <div style="margin-bottom: 8px;">
                    <label style="font-size: 12px; color: var(--text-sub);">飲んだ日: </label>
                    <input type="date" id="memoDate" class="memo-input" value="${escapeHTML(memo.date)}" style="width: 150px; padding: 4px;">
                </div>
                <textarea id="memoText" class="memo-input" style="height: 80px; resize: vertical;" placeholder="色、香り、味わいなどの記録を自由に記入してください...">${escapeHTML(memo.text)}</textarea>
                
                <div style="display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;">
                    <button class="btn-evernote" onclick="shareToEvernote(${b.id}, event)">🐘 Evernote等へ送る</button>
                    <span style="flex:1;"></span>
                    <span id="memoSavedMsg" class="memo-saved-msg">✓ 保存しました</span>
                    <button class="btn-save-memo" onclick="saveMemo(${b.id}, event)">💾 保存する</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById("beerModal").classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeModal(modalId, e) {
    if (e) {
        e.stopPropagation();
        if (e.target.closest('.modal-content') && !e.target.closest('.modal-close')) return;
    }
    document.getElementById(modalId).classList.remove("active");
    document.body.style.overflow = "auto";
}

function initApp() {
    document.getElementById("searchInput").value = "";
    document.getElementById("sortSelect").value = "abv_desc";
    document.getElementById("searchInput").addEventListener("input", filterAndSort);
    document.getElementById("sortSelect").addEventListener("change", filterAndSort);
    resetFilters();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
} else {
    initApp();
}

</script>
</body>
</html>
